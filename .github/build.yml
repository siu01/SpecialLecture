name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  on_build_actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
#          python -m pip install --upgrade pip
#          pip install -r requirements.txt
      - name: Run Tests
        run: python -m unittest tests/test.py