name: Test
on:
  push:
  - branches: ["main"]
jobs:
  on_build_actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
           python -m pip install --upgrade pip
      - name: Run Tests
        run: python -m unittest tests/__init__.py
